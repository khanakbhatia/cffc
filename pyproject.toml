[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cffc"
version = "0.1.0"
description = "Cloud Forensic Evidence Correlation Framework - research software"
requires-python = ">=3.11"
dependencies = ["pandas>=2.0", "matplotlib>=3.7"]

[project.scripts]
cffc = "cffc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
